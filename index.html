<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jazyková Akademie s Dominikem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f7f9fa;
            color: #3c3c3c;
            user-select: none;
        }
        .duo-card {
            border: 2px solid #e5e5e5;
            border-bottom-width: 4px;
            border-radius: 1rem;
            transition: all 0.1s ease;
        }
        .duo-btn-green {
            background-color: #58cc02;
            border-bottom: 4px solid #46a302;
            color: white;
            font-weight: 800;
            border-radius: 1rem;
            transition: all 0.1s ease;
        }
        .duo-btn-green:active {
            border-bottom-width: 2px;
            transform: translateY(2px);
        }
        .duo-btn-blue {
            background-color: #1cb0f6;
            border-bottom: 4px solid #1899d6;
            color: white;
            font-weight: 800;
            border-radius: 1rem;
            transition: all 0.1s ease;
        }
        .duo-btn-blue:active {
            border-bottom-width: 2px;
            transform: translateY(2px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <header class="w-full p-4 flex justify-between items-center max-w-4xl mx-auto">
        <h1 class="text-2xl font-black text-green-500 tracking-wider">LINGO<span class="text-sky-400">DOM</span></h1>
        <button id="secretAdminBtn" onclick="openAdminLogin()" class="text-gray-300 hover:text-gray-600 font-bold text-xl px-2 transition" title="Admin">A</button>
    </header>

    <main id="app" class="flex-grow flex items-center justify-center p-4">
    </main>

    <footer class="text-center p-4 text-gray-400 text-sm">
        Učení Jazyků s Dominikem &copy; 2026
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, update, remove, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXavKf54t-SFA0K-j-tcMtg65qUSB041o",
            authDomain: "ucenijazykusesominikem.firebaseapp.com",
            databaseURL: "https://ucenijazykusesominikem-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "ucenijazykusesominikem",
            storageBucket: "ucenijazykusesominikem.firebasestorage.app",
            messagingSenderId: "396497955498",
            appId: "1:396497955498:web:2654dd38dd9c34184c3ed3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        window.db = db;
        window.auth = auth;
        window.currentUser = null;
        window.currentLang = '';
        window.currentCategory = '';
        window.currentMode = 'poslech'; 
        window.learningItems = [];
        window.allAvailableWords = [];
        window.currentIndex = 0;
        window.score = 0;
        window.langStartTime = null;
        window.isAdminMode = false;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.currentUser = user;
                loadDashboard();
            } else {
                if(!window.isAdminMode) renderWelcomeScreen();
            }
        });

        // --- TAJNÝ ADMIN LOGIN ---
        window.openAdminLogin = function() {
            const pass = prompt("Zadej admin heslo:");
            if (pass === "6852") {
                window.isAdminMode = true;
                alert("Admin režim aktivován!");
                loadDashboard();
            } else if (pass !== null) {
                alert("Nesprávné heslo!");
            }
        }

        // --- ODHLÁŠENÍ ---
        window.handleSignOut = async function() {
            try {
                await signOut(auth);
                window.currentUser = null;
                window.isAdminMode = false;
                renderWelcomeScreen();
            } catch (error) {
                alert("Chyba při odhlašování: " + error.message);
            }
        }

        // --- OBRAZOVKY ---
        window.renderWelcomeScreen = function() {
            document.getElementById('app').innerHTML = `
                <div class="duo-card bg-white p-8 max-w-md w-full text-center shadow-lg">
                    <h2 class="text-3xl font-black mb-2 text-gray-700">Uč se jazyky zábavně!</h2>
                    <p class="text-gray-400 mb-8">Polština, Němčina a Japonština na jednom místě.</p>
                    <div class="space-y-4">
                        <button onclick="renderAuthForm('new')" class="w-full py-3 duo-btn-green text-lg">Nový Účet</button>
                        <button onclick="renderAuthForm('existing')" class="w-full py-3 duo-btn-blue text-lg">Již mám Účet</button>
                    </div>
                </div>
            `;
        }

        window.renderAuthForm = function(type) {
            const title = type === 'new' ? 'Vytvořit účet' : 'Přihlásit se';
            const actionText = type === 'new' ? 'Zaregistrovat' : 'Vstoupit';
            
            document.getElementById('app').innerHTML = `
                <div class="duo-card bg-white p-8 max-w-md w-full shadow-lg">
                    <h2 class="text-2xl font-black mb-6 text-center text-gray-700">${title}</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-500 mb-1">Uživatelské jméno</label>
                            <input type="text" id="authUsername" class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-sky-400 outline-none font-semibold" placeholder="např. Dominik">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-500 mb-1">Heslo</label>
                            <input type="password" id="authPassword" class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-sky-400 outline-none font-semibold" placeholder="••••••••">
                        </div>
                        <button onclick="handleAuth('${type}')" class="w-full py-3 duo-btn-green text-lg mt-4">${actionText}</button>
                        <button onclick="renderWelcomeScreen()" class="w-full py-2 text-gray-400 font-bold hover:text-gray-600">Zpět</button>
                    </div>
                </div>
            `;
        }

        window.handleAuth = async function(type) {
            const usernameInput = document.getElementById('authUsername').value.trim();
            const pass = document.getElementById('authPassword').value;

            if(!usernameInput || !pass) {
                alert("Vyplňte uživatelské jméno i heslo.");
                return;
            }

            const cleanUsername = usernameInput.toLowerCase().replace(/[^a-z0-9]/g, '_');
            const fakeEmail = `${cleanUsername}@ucenijazyku.app`;

            try {
                if(type === 'new') {
                    await createUserWithEmailAndPassword(auth, fakeEmail, pass);
                } else {
                    await signInWithEmailAndPassword(auth, fakeEmail, pass);
                }
            } catch(error) {
                alert("Chyba při přihlášení/registraci: " + error.message);
            }
        }

        window.loadDashboard = async function() {
            const snap = await get(ref(db, `jazyky`));
            const jazykyData = snap.val() || {};

            const languages = [
                { id: 'polština', name: 'Polština', flagHtml: `<svg class="w-full h-full" viewBox="0 0 16 10" preserveAspectRatio="none"><rect width="16" height="5" fill="white"/><rect y="5" width="16" height="5" fill="#dc143c"/></svg>` },
                { id: 'němčina', name: 'Němčina', flagHtml: `<svg class="w-full h-full" viewBox="0 0 5 3" preserveAspectRatio="none"><rect width="5" height="1" fill="#000000"/><rect y="1" width="5" height="1" fill="#dd0000"/><rect y="2" width="5" height="1" fill="#ffcc00"/></svg>` },
                { id: 'japonština', name: 'Japonština', flagHtml: `<svg class="w-full h-full" viewBox="0 0 900 600" preserveAspectRatio="none"><rect width="900" height="600" fill="#ffffff"/><circle cx="450" cy="300" r="180" fill="#bc002d"/></svg>` }
            ];

            let languagesHtml = '';
            languages.forEach(lang => {
                languagesHtml += `
                    <div onclick="selectLanguage('${lang.id}')" class="duo-card bg-white p-6 cursor-pointer hover:border-sky-400 flex flex-col items-center shadow-md">
                        <div class="w-32 h-20 mb-4 rounded-xl overflow-hidden shadow-inner border-2 border-gray-200 flex flex-col">
                            ${lang.flagHtml}
                        </div>
                        <h3 class="text-2xl font-black text-gray-700">${lang.name}</h3>
                    </div>
                `;
            });

            document.getElementById('app').innerHTML = `
                <div class="max-w-3xl w-full text-center">
                    <div class="flex justify-between items-center mb-6 px-4">
                        <h2 class="text-2xl font-black text-gray-700">Vyber si jazyk</h2>
                        <button onclick="handleSignOut()" class="text-red-400 font-bold text-sm hover:underline cursor-pointer">Odhlásit</button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                        ${languagesHtml}
                    </div>
                </div>
            `;
        }

        window.selectLanguage = function(lang) {
            window.currentLang = lang;
            renderCategoryScreen(lang);
        }

        window.renderCategoryScreen = async function(lang) {
            const snapshot = await get(ref(db, `jazyky/${lang}/kategorie`));
            let categories = snapshot.val() || { "Pozdravy": {}, "Všeobecné": {} };
            
            let catHtml = '';
            for(let cat in categories) {
                catHtml += `
                    <div onclick="openCategory('${cat}')" class="duo-card bg-white p-4 cursor-pointer hover:bg-sky-50 font-black text-lg text-gray-700 flex justify-between items-center mb-3">
                        <span>📂 ${cat}</span>
                        <span class="text-sky-400">&rarr;</span>
                    </div>
                `;
            }

            document.getElementById('app').innerHTML = `
                <div class="max-w-xl w-full">
                    <button onclick="loadDashboard()" class="text-gray-400 font-bold mb-4 hover:text-gray-600">&larr; Zpět na jazyky</button>
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-3xl font-black text-gray-700 capitalize">Jazyk: ${lang}</h2>
                        ${window.isAdminMode ? `<button onclick="window.adminSelectedLang='${lang}'; renderAdminPanel();" class="px-3 py-2 bg-red-500 text-white rounded-xl font-bold text-sm shadow">🛡️ Upravit v Adminu</button>` : ''}
                    </div>
                    <div class="space-y-2">
                        ${catHtml}
                    </div>
                </div>
            `;
        }

        window.openCategory = function(category) {
            window.currentCategory = category;
            document.getElementById('app').innerHTML = `
                <div class="max-w-xl w-full text-center">
                    <button onclick="renderCategoryScreen('${window.currentLang}')" class="text-gray-400 font-bold mb-4 hover:text-gray-600 block text-left">&larr; Zpět na kategorie</button>
                    <div class="duo-card bg-white p-8 shadow-md">
                        <h2 class="text-3xl font-black mb-2 text-gray-700">${category}</h2>
                        <p class="text-gray-400 mb-8">Vyber si režim učení:</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <button onclick="alert('Spouštím učení...')" class="py-3 duo-btn-blue text-md sm:col-span-2">📖 Učení Slov (Kartičky)</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- ADMIN PANEL ---
        window.adminSelectedLang = '';

        window.renderAdminPanel = async function() {
            const lang = window.adminSelectedLang;
            const snap = await get(ref(db, `jazyky/${lang}/kategorie`));
            const categories = snap.val() || {};

            let catsHtml = '';
            for(let cat in categories) {
                catsHtml += `
                    <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 flex justify-between items-center mb-3">
                        <h4 class="font-black text-gray-700">${cat}</h4>
                        <button onclick="deleteAdminCategory('${cat}')" class="px-3 py-1.5 bg-red-500 text-white font-bold rounded-lg text-xs shadow">Smazat</button>
                    </div>
                `;
            }

            document.getElementById('app').innerHTML = `
                <div class="max-w-xl w-full">
                    <button onclick="renderCategoryScreen('${lang}')" class="text-gray-400 font-bold mb-4 hover:text-gray-600 block text-left">&larr; Zpět</button>
                    <div class="duo-card bg-white p-8 shadow-md">
                        <h2 class="text-2xl font-black mb-1 text-red-500">🛡️ Admin Panel: ${lang}</h2>
                        <div class="mb-6 flex gap-2 mt-4">
                            <input type="text" id="newCatNameInput" placeholder="Název nové kategorie..." class="flex-grow p-3 border-2 border-gray-200 rounded-xl outline-none font-semibold text-sm">
                            <button onclick="addAdminCategory()" class="py-3 px-4 duo-btn-green text-sm">Přidat</button>
                        </div>
                        <div class="max-h-80 overflow-y-auto mb-6">
                            ${catsHtml || '<p class="text-gray-400 text-sm italic text-center">Zatím žádné kategorie.</p>'}
                        </div>
                    </div>
                </div>
            `;
        }

        window.addAdminCategory = async function() {
            const input = document.getElementById('newCatNameInput');
            const catName = input.value.trim();
            if(!catName) return alert("Zadej název kategorie!");
            const lang = window.adminSelectedLang;
            await set(ref(db, `jazyky/${lang}/kategorie/${catName}/slova/dummy`), {
                slovo: "Vítej",
                preklad: "Vítej"
            });
            renderAdminPanel();
        }

        window.deleteAdminCategory = async function(catName) {
            if(!confirm(`Opravdu smazat kategorii "${catName}"?`)) return;
            const lang = window.adminSelectedLang;
            await remove(ref(db, `jazyky/${lang}/kategorie/${catName}`));
            renderAdminPanel();
        }
    </script>
</body>
</html>
