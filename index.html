<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jazyková Akademie s Dominikem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f7f9fa;
            color: #3c3c3c;
            user-select: none;
        }
        .duo-card {
            border: 2px solid #e5e5e5;
            border-bottom-width: 4px;
            border-radius: 1rem;
            transition: all 0.1s ease;
        }
        .duo-btn-green {
            background-color: #58cc02;
            border-bottom: 4px solid #46a302;
            color: white;
            font-weight: 800;
            border-radius: 1rem;
            transition: all 0.1s ease;
        }
        .duo-btn-green:active {
            border-bottom-width: 2px;
            transform: translateY(2px);
        }
        .duo-btn-blue {
            background-color: #1cb0f6;
            border-bottom: 4px solid #1899d6;
            color: white;
            font-weight: 800;
            border-radius: 1rem;
            transition: all 0.1s ease;
        }
        .duo-btn-blue:active {
            border-bottom-width: 2px;
            transform: translateY(2px);
        }
        .correct-answer {
            background-color: #d7ffb8 !important;
            border-color: #58cc02 !important;
            color: #277000 !important;
        }
        .wrong-answer {
            background-color: #ffdfe0 !important;
            border-color: #ff4b4b !important;
            color: #ea2b2b !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <header class="w-full p-4 flex justify-between items-center max-w-4xl mx-auto">
        <h1 class="text-2xl font-black text-green-500 tracking-wider">LINGO<span class="text-sky-400">DOM</span></h1>
        <button id="secretAdminBtn" onclick="openAdminLogin()" class="text-gray-300 hover:text-gray-600 font-bold text-xl px-2 transition" title="Admin">A</button>
    </header>

    <main id="app" class="flex-grow flex items-center justify-center p-4">
        </main>

    <footer class="w-full p-4 flex justify-between items-center text-gray-400 text-sm max-w-4xl mx-auto">
        <div>Učení Jazyků s Dominikem &copy; 2026</div>
        <div id="appVersionDisplay" class="font-bold text-gray-500 bg-gray-200 px-2.5 py-1 rounded-lg">Verze: 1.0</div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, update, remove, push, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXavKf54t-SFA0K-j-tcMtg65qUSB041o",
            authDomain: "ucenijazykusesominikem.firebaseapp.com",
            databaseURL: "https://ucenijazykusesominikem-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "ucenijazykusesominikem",
            storageBucket: "ucenijazykusesominikem.firebasestorage.app",
            messagingSenderId: "396497955498",
            appId: "1:396497955498:web:2654dd38dd9c34184c3ed3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        window.db = db;
        window.auth = auth;
        window.currentUser = null;
        window.currentLang = '';
        window.currentCategory = '';
        window.currentMode = 'poslech'; 
        window.learningItems = [];
        window.allAvailableWords = [];
        window.currentIndex = 0;
        window.score = 0;
        window.langStartTime = null;
        window.isAdminMode = false;
        window.appVersion = '1.0';

        // Načtení verze z DB při startu
        async function loadAppVersion() {
            try {
                const snap = await get(ref(db, 'system/verze'));
                if (snap.exists()) {
                    window.appVersion = snap.val();
                } else {
                    await set(ref(db, 'system/verze'), '1.0');
                }
                const versionEl = document.getElementById('appVersionDisplay');
                if (versionEl) {
                    versionEl.innerHTML = `Verze: ${window.appVersion}`;
                }
            } catch (e) {
                console.error("Chyba při načítání verze:", e);
            }
        }
        loadAppVersion();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.currentUser = user;
                loadDashboard();
            } else {
                if(!window.isAdminMode) renderWelcomeScreen();
            }
        });

        // --- ADMIN PŘIHLÁŠENÍ A SPRÁVA VERZE ---
        window.openAdminLogin = function() {
            const pass = prompt("Zadejte admin heslo:");
            if (pass === "6852") {
                window.isAdminMode = true;
                alert("Admin režim aktivován!");
                loadDashboard();
            } else if (pass !== null) {
                alert("Nesprávné heslo!");
            }
        }

        window.updateVersion = async function() {
            const newVer = prompt("Zadejte novou verzi aplikace (např. 1.1):", window.appVersion);
            if (newVer) {
                await set(ref(db, 'system/verze'), newVer);
                window.appVersion = newVer;
                document.getElementById('appVersionDisplay').innerHTML = `Verze: ${newVer}`;
                alert("Verze byla úspěšně změněna!");
            }
        }

        // --- ODHLÁŠENÍ ---
        window.handleSignOut = async function() {
            try {
                await signOut(auth);
                window.currentUser = null;
                window.isAdminMode = false;
                renderWelcomeScreen();
            } catch (error) {
                alert("Chyba při odhlašování: " + error.message);
            }
        }

        // --- OBRAZOVKY ---
        window.renderWelcomeScreen = function() {
            document.getElementById('app').innerHTML = `
                <div class="duo-card bg-white p-8 max-w-md w-full text-center shadow-lg">
                    <h2 class="text-3xl font-black mb-2 text-gray-700">Uč se jazyky zábavně!</h2>
                    <p class="text-gray-400 mb-8">Polština, Němčina a Japonština na jednom místě.</p>
                    <div class="space-y-4">
                        <button onclick="renderAuthForm('new')" class="w-full py-3 duo-btn-green text-lg">Nový Účet</button>
                        <button onclick="renderAuthForm('existing')" class="w-full py-3 duo-btn-blue text-lg">Již mám Účet</button>
                    </div>
                </div>
            `;
        }

        window.renderAuthForm = function(type) {
            const title = type === 'new' ? 'Vytvořit účet' : 'Přihlásit se';
            const actionText = type === 'new' ? 'Zaregistrovat' : 'Vstoupit';
            
            document.getElementById('app').innerHTML = `
                <div class="duo-card bg-white p-8 max-w-md w-full shadow-lg">
                    <h2 class="text-2xl font-black mb-6 text-center text-gray-700">${title}</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-500 mb-1">Uživatelské jméno</label>
                            <input type="text" id="authUsername" class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-sky-400 outline-none font-semibold" placeholder="např. Dominik">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-500 mb-1">Heslo</label>
                            <input type="password" id="authPassword" class="w-full p-3 border-2 border-gray-200 rounded-xl focus:border-sky-400 outline-none font-semibold" placeholder="••••••••">
                        </div>
                        <button onclick="handleAuth('${type}')" class="w-full py-3 duo-btn-green text-lg mt-4">${actionText}</button>
                        <button onclick="renderWelcomeScreen()" class="w-full py-2 text-gray-400 font-bold hover:text-gray-600">Zpět</button>
                    </div>
                </div>
            `;
        }

        window.handleAuth = async function(type) {
            const usernameInput = document.getElementById('authUsername').value.trim();
            const pass = document.getElementById('authPassword').value;

            if(!usernameInput || !pass) {
                alert("Vyplňte uživatelské jméno i heslo.");
                return;
            }

            const cleanUsername = usernameInput.toLowerCase().replace(/[^a-z0-9]/g, '_');
            const fakeEmail = `${cleanUsername}@ucenijazyku.app`;

            try {
                if(type === 'new') {
                    await createUserWithEmailAndPassword(auth, fakeEmail, pass);
                } else {
                    await signInWithEmailAndPassword(auth, fakeEmail, pass);
                }
            } catch(error) {
                alert("Chyba při přihlášení/registraci: " + error.message);
            }
        }

        window.loadDashboard = async function() {
            // Načtení stavů jazyků z databáze
            const snap = await get(ref(db, `jazyky`));
            const jazykyData = snap.val() || {};

            const polstinaStav = jazykyData['polština']?.stav || 'aktivni';
            const nemcinaStav = jazykyData['němčina']?.stav || 'aktivni';
            const japonstinaStav = jazykyData['japonština']?.stav || 'aktivni';

            const languages = [
                { id: 'polština', name: 'Polština', stav: polstinaStav, flagHtml: `<svg class="w-full h-full" viewBox="0 0 16 10" preserveAspectRatio="none"><rect width="16" height="5" fill="white"/><rect y="5" width="16" height="5" fill="#dc143c"/></svg>` },
                { id: 'němčina', name: 'Němčina', stav: nemcinaStav, flagHtml: `<svg class="w-full h-full" viewBox="0 0 5 3" preserveAspectRatio="none"><rect width="5" height="1" fill="#000000"/><rect y="1" width="5" height="1" fill="#dd0000"/><rect y="2" width="5" height="1" fill="#ffcc00"/></svg>` },
                { id: 'japonština', name: 'Japonština', stav: japonstinaStav, flagHtml: `<svg class="w-full h-full" viewBox="0 0 900 600" preserveAspectRatio="none"><rect width="900" height="600" fill="#ffffff"/><circle cx="450" cy="300" r="180" fill="#bc002d"/></svg>` }
            ];

            let languagesHtml = '';

            languages.forEach(lang => {
                // Pokud je jazyk zamknutý a uživatel NENÍ admin, zcela ho přeskočíme
                if (lang.stav === 'zamknuto' && !window.isAdminMode) {
                    return;
                }

                let adminMenuHtml = '';
                if (window.isAdminMode) {
                    let lockBtnText = lang.stav === 'zamknuto' ? 'Odemknout' : 'Zamknout';
                    let lockAction = lang.stav === 'zamknuto' ? 'aktivni' : 'zamknuto';
                    let stopBtnText = lang.stav === 'zastaveno' ? 'Odemknout' : 'Zastavit';
                    let stopAction = lang.stav === 'zastaveno' ? 'aktivni' : 'zastaveno';

                    adminMenuHtml = `
                        <div class="absolute top-2 right-2 z-25">
                            <button onclick="event.stopPropagation(); toggleDashboardMenu('${lang.id}')" class="px-2.5 py-1 bg-white border border-gray-300 rounded-lg font-black text-gray-700 shadow-md hover:bg-gray-100">⋮</button>
                            <div id="dashMenu_${lang.id}" class="hidden absolute right-0 mt-1 w-40 bg-white border border-gray-200 rounded-xl shadow-xl py-1 text-left z-30">
                                <button onclick="event.stopPropagation(); setLangStatusDashboard('${lang.id}', '${lockAction}')" class="w-full px-4 py-2 text-xs font-bold text-gray-700 hover:bg-gray-100">${lockBtnText}</button>
                                <button onclick="event.stopPropagation(); setLangStatusDashboard('${lang.id}', '${stopAction}')" class="w-full px-4 py-2 text-xs font-bold text-red-600 hover:bg-gray-100">${stopBtnText}</button>
                            </div>
                        </div>
                    `;
                }

                if (lang.stav === 'zastaveno' && !window.isAdminMode) {
                    languagesHtml += `
                        <div class="duo-card bg-gray-100 p-6 flex flex-col items-center shadow-md relative opacity-75">
                            ${adminMenuHtml}
                            <span class="absolute top-3 left-3 text-xl" title="Jazyk je zastavený">🔒</span>
                            <div class="w-32 h-20 mb-4 rounded-xl overflow-hidden shadow-inner border-2 border-gray-200 flex flex-col grayscale mt-4">
                                ${lang.flagHtml}
                            </div>
                            <h3 class="text-2xl font-black text-gray-500 mb-1">${lang.name}</h3>
                            <p class="text-xs font-bold text-red-500 text-center">Jazyk je zastavený. K dispozici bude již brzy.</p>
                        </div>
                    `;
                } else if (lang.stav === 'zamknuto' && window.isAdminMode) {
                    languagesHtml += `
                        <div onclick="selectLanguage('${lang.id}')" class="duo-card bg-red-50 p-6 cursor-pointer hover:bg-red-100 flex flex-col items-center shadow-md relative border-red-200">
                            ${adminMenuHtml}
                            <span class="absolute top-3 left-3 text-xs font-bold text-red-600 bg-white px-2 py-0.5 rounded shadow" title="Zcela zamknuto">👁️‍🗨️ Zamčeno (Admin přístup)</span>
                            <div class="w-32 h-20 mb-4 rounded-xl overflow-hidden shadow-inner border-2 border-red-200 flex flex-col opacity-60 mt-6">
                                ${lang.flagHtml}
                            </div>
                            <h3 class="text-2xl font-black text-red-500 mb-1">${lang.name}</h3>
                            <p class="text-xs font-bold text-red-400 text-center">Kliknutím vstoupíš jako Admin</p>
                        </div>
                    `;
                } else if (lang.stav === 'zastaveno' && window.isAdminMode) {
                    languagesHtml += `
                        <div onclick="selectLanguage('${lang.id}')" class="duo-card bg-amber-50 p-6 cursor-pointer hover:bg-amber-100 flex flex-col items-center shadow-md relative border-amber-200">
                            ${adminMenuHtml}
                            <span class="absolute top-3 left-3 text-xs font-bold text-amber-700 bg-white px-2 py-0.5 rounded shadow">🔒 Zastaveno (Admin přístup)</span>
                            <div class="w-32 h-20 mb-4 rounded-xl overflow-hidden shadow-inner border-2 border-amber-200 flex flex-col mt-6">
                                ${lang.flagHtml}
                            </div>
                            <h3 class="text-2xl font-black text-amber-700 mb-1">${lang.name}</h3>
                            <p class="text-xs font-bold text-amber-600 text-center">Jazyk zastaven pro lidi, ty ho spravuješ.</p>
                        </div>
                    `;
                } else {
                    languagesHtml += `
                        <div onclick="selectLanguage('${lang.id}')" class="duo-card bg-white p-6 cursor-pointer hover:border-sky-400 flex flex-col items-center shadow-md relative">
                            ${adminMenuHtml}
                            <div class="w-32 h-20 mb-4 rounded-xl overflow-hidden shadow-inner border-2 border-gray-200 flex flex-col mt-4 sm:mt-0">
                                ${lang.flagHtml}
                            </div>
                            <h3 class="text-2xl font-black text-gray-700">${lang.name}</h3>
                        </div>
                    `;
                }
            });

            if (!languagesHtml) {
                languagesHtml = `<p class="text-gray-400 text-center col-span-2">Všechny jazyky jsou aktuálně zamčené.</p>`;
            }

            document.getElementById('app').innerHTML = `
                <div class="max-w-3xl w-full text-center">
                    <div class="flex justify-between items-center mb-6 px-4">
                        <div>
                            <h2 class="text-2xl font-black text-gray-700">Vyber si jazyk</h2>
                            ${window.isAdminMode ? '<div class="mt-2 flex items-center justify-center gap-2"><span class="text-xs font-bold text-red-500 bg-red-50 px-2 py-0.5 rounded border border-red-200">Admin Režim aktivní</span><button onclick="updateVersion()" class="text-xs font-bold bg-gray-800 text-white px-2 py-0.5 rounded shadow">⚙️ Změnit verzi</button></div>' : ''}
                        </div>
                        <button onclick="handleSignOut()" class="text-red-400 font-bold text-sm hover:underline cursor-pointer">Odhlásit</button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                        ${languagesHtml}
                    </div>
                </div>
            `;
        }

        window.toggleDashboardMenu = function(langId) {
            document.querySelectorAll('[id^="dashMenu_"]').forEach(m => {
                if(m.id !== `dashMenu_${langId}`) m.classList.add('hidden');
            });
            const menu = document.getElementById(`dashMenu_${langId}`);
            if(menu) menu.classList.toggle('hidden');
        }

        window.setLangStatusDashboard = async function(langId, status) {
            await set(ref(db, `jazyky/${langId}/stav`), status);
            loadDashboard();
        }

        // --- SLEDOVÁNÍ ČASU A STATISTIKY UŽIVATELŮ ---
        window.selectLanguage = async function(lang) {
            window.currentLang = lang;
            window.langStartTime = Date.now();

            if(window.currentUser) {
                const username = window.currentUser.email.split('@')[0];
                const userRef = ref(db, `statistiky/${lang}/uzivatele/${username}`);
                const snap = await get(userRef);
                const data = snap.val();
                
                if(!data || !data.prvniNavstiva) {
                    await update(userRef, {
                        posledniAktivita: Date.now(),
                        online: true
                    });
                } else {
                    await update(userRef, {
                        posledniAktivita: Date.now(),
                        online: true
                    });
                }
            }

            if(window.activityInterval) clearInterval(window.activityInterval);
            window.activityInterval = setInterval(async () => {
                if(window.currentUser && window.currentLang === lang && window.langStartTime) {
                    const elapsed = (Date.now() - window.langStartTime) / 1000;
                    if(elapsed >= 15) {
                        const username = window.currentUser.email.split('@')[0];
                        const userRef = ref(db, `statistiky/${lang}/uzivatele/${username}`);
                        const snap = await get(userRef);
                        const data = snap.val();
                        if(!data || !data.prvniNavstiva) {
                            await update(userRef, {
                                prvniNavstiva: new Date().toLocaleString('cs-CZ'),
                                posledniAktivita: Date.now(),
                                online: true
                            });
                        }
                    }
                }
            }, 5000);

            renderCategoryScreen(lang);
        }

        window.renderCategoryScreen = async function(lang) {
            const snapshot = await get(ref(db, `jazyky/${lang}/kategorie`));
            let categories = snapshot.val() || { "Pozdravy": {}, "Všeobecné": {} };
            
            if(!categories["Pozdravy"]) categories["Pozdravy"] = {};
            if(!categories["Všeobecné"]) categories["Všeobecné"] = {};

            let catHtml = '';
            for(let cat in categories) {
                catHtml += `
                    <div onclick="openCategory('${cat}')" class="duo-card bg-white p-4 cursor-pointer hover:bg-sky-50 font-black text-lg text-gray-700 flex justify-between items-center">
                        <span>📂 ${cat}</span>
                        <span class="text-sky-400">&rarr;</span>
                    </div>
                `;
            }

            document.getElementById('app').innerHTML = `
                <div class="max-w-xl w-full">
                    <button onclick="loadDashboard()" class="text-gray-400 font-bold mb-4 hover:text-gray-600">&larr; Zpět na jazyky</button>
                    
                    <div onclick="openLanguageStats()" class="duo-card bg-sky-50 p-4 mb-6 cursor-pointer hover:bg-sky-100 flex items-center justify-between border-sky-200">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-sky-400 rounded-full flex items-center justify-center text-2xl text-white shadow">👤</div>
                            <div>
                               <h3 class="font-black text-sky-700 text-lg">Statistiky učících se</h3>
                               <p class="text-xs text-gray-500 font-bold">Klikni pro zobrazení uživatelů a aktivity</p>
                            </div>
                        </div>
                        <span class="text-sky-500 font-black text-xl">&rarr;</span>
                    </div>

                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-3xl font-black text-gray-700 capitalize">Jazyk: ${lang}</h2>
                        ${window.isAdminMode ? `<button onclick="window.adminSelectedLang='${lang}'; renderAdminPanel();" class="px-3 py-2 bg-red-500 text-white rounded-xl font-bold text-sm shadow">🛡️ Upravit v Adminu</button>` : ''}
                    </div>

                    <div class="space-y-4">
                        ${catHtml}
                    </div>
                </div>
            `;
        }

        window.openLanguageStats = async function() {
            const lang = window.currentLang;
            const snap = await get(ref(db, `statistiky/${lang}/uzivatele`));
            const users = snap.val() || {};

            let usersListHtml = '';
            let activeCount = 0;
            const now = Date.now();

            for(let username in users) {
                const uData = users[username];
                const isOnline = uData.posledniAktivita && (now - uData.posledniAktivita < 60000);
                const statusBadge = isOnline ? '<span class="text-green-500 font-bold text-xs bg-green-50 px-2 py-1 rounded-full border border-green-200">● Online</span>' : '<span class="text-gray-400 font-bold text-xs bg-gray-100 px-2 py-1 rounded-full border border-gray-200">○ Offline</span>';
                
                if(uData.prvniNavstiva) {
                    activeCount++;
                    usersListHtml += `
                        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 flex justify-between items-center">
                            <div>
                                <p class="font-black text-gray-700 text-md">${username}</p>
                                <p class="text-xs text-gray-400 font-semibold">Aktivní od: ${uData.prvniNavstiva}</p>
                            </div>
                            <div>${statusBadge}</div>
                        </div>
                    `;
                }
            }

            if(!usersListHtml) {
                usersListHtml = `<p class="text-gray-400 text-sm italic text-center py-4">Zatím žádný uživatel nestrávil na tomto jazyku více než 15 sekund.</p>`;
            }

            document.getElementById('app').innerHTML = `
                <div class="duo-card bg-white p-8 max-w-lg w-full shadow-lg relative">
                    <button onclick="renderCategoryScreen('${lang}')" class="absolute top-4 left-4 text-gray-400 font-bold hover:text-gray-600">✕</button>
                    <h2 class="text-2xl font-black mb-2 text-gray-700 text-center">Statistiky: ${lang}</h2>
                    <p class="text-center text-sky-600 font-bold mb-6">Celkem uživatelů (více než 15s): ${activeCount}</p>
                    <div class="space-y-3 max-h-64 overflow-y-auto pr-2 mb-6">
                        ${usersListHtml}
                    </div>
                    <button onclick="renderCategoryScreen('${lang}')" class="w-full py-3 duo-btn-green text-md">Zpět</button>
                </div>
            `;
        }

        window.openCategory = async function(category) {
            window.currentCategory = category;
            
            document.getElementById('app').innerHTML = `
                <div class="max-w-xl w-full text-center">
                    <button onclick="renderCategoryScreen('${window.currentLang}')" class="text-gray-400 font-bold mb-4 hover:text-gray-600 block text-left">&larr; Zpět na kategorie</button>
                    <div class="duo-card bg-white p-8 shadow-md">
                        <h2 class="text-3xl font-black mb-2 text-gray-700">${category}</h2>
                        <p class="text-gray-400 mb-8">Vyber si režim učení:</p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <button onclick="startLearning('uceni')" class="py-3 duo-btn-blue text-md sm:col-span-2">📖 Učení Slov / Vět (Kartičky)</button>
                            <button onclick="startLearning('poslech')" class="py-3 duo-btn-blue text-md">🎧 Poslouchání (Kvíz)</button>
                            <button onclick="startLearning('psani')" class="py-3 duo-btn-green text-md">⌨️ Psaní (Klávesnice)</button>
                            <button onclick="startLearning('cteni')" class="py-3 duo-btn-green text-md">🗣️ Čtení do hlasovky</button>
                            <button onclick="startLearning('vety')" class="py-3 duo-btn-blue text-md">📜 Věty</button>
                            <button onclick="startLearning('preklad_textu')" class="py-3 duo-btn-green text-md sm:col-span-2">✍️ Přepis ČJ textu</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- UČENÍ A REŽIMY ---
        window.startLearning = async function(mode) {
            window.currentMode = mode;
            window.currentIndex = 0;
            window.score = 0;

            const lang = window.currentLang;
            const cat = window.currentCategory;

            const allSnap = await get(ref(db, `jazyky/${lang}/kategorie`));
            const allCatsData = allSnap.val() || {};
            let globalWords = [];
            for(let c in allCatsData) {
                if(allCatsData[c].slova) {
                    globalWords = globalWords.concat(Object.values(allCatsData[c].slova));
                }
            }
            window.allAvailableWords = globalWords;

            let items = [];
            if(mode === 'vety') {
                const snap = await get(ref(db, `jazyky/${lang}/vety`));
                const data = snap.val() || {};
                items = Object.values(data);
            } else if(mode === 'preklad_textu') {
                const snap = await get(ref(db, `jazyky/${lang}/texty`));
                const data = snap.val() || {};
                items = Object.values(data);
            } else {
                if(cat === 'Všeobecné') {
                    items = globalWords;
                } else {
                    const snap = await get(ref(db, `jazyky/${lang}/kategorie/${cat}/slova`));
                    const data = snap.val() || {};
                    items = Object.values(data);
                }
            }

            window.learningItems = items;
            if(items.length === 0) {
                alert("V této kategorii zatím nejsou žádná data!");
                return;
            }

            renderExercise();
        }
    </script>
</body>
</html>
